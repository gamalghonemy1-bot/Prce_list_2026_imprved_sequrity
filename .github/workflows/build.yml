name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - name: Add print bridge for Android
        run: |
          f=$(find android/app/src/main/java -name MainActivity.java | head -1)
          cat > "$f" <<'EOF'
          package com.electric.pricelist;
          import android.content.Context;
          import android.os.Bundle;
          import android.print.PrintAttributes;
          import android.print.PrintDocumentAdapter;
          import android.print.PrintManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            @Override public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              final WebView wv = getBridge().getWebView();
              wv.addJavascriptInterface(new Object() {
                @JavascriptInterface public void print() {
                  runOnUiThread(new Runnable() { public void run() {
                    PrintManager pm = (PrintManager) getSystemService(Context.PRINT_SERVICE);
                    PrintDocumentAdapter a = wv.createPrintDocumentAdapter("BOQ");
                    pm.print("BOQ", a, new PrintAttributes.Builder().build());
                  }});
                }
              }, "AndroidPrint");
            }
          }
          EOF
      - name: Stamp build time
        run: sed -i "s/__BUILD_TS__/$(date +%s)000/" www/index.html
      - name: Use fixed signing key
        run: |
          python3 - <<'EOF'
          p = 'android/app/build.gradle'
          s = open(p).read()
          block = """android {
              signingConfigs {
                  debug {
                      storeFile file("${rootProject.projectDir}/../fixed.keystore")
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }"""
          assert 'android {' in s
          s = s.replace('android {', block, 1)
          open(p, 'w').write(s)
          EOF
      - run: npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: pricelist-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
